<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GOSI Qualimetry — Scenarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark" id="brandMark">G</div>
        <div class="brand-name">
          <span class="org">GOSI</span>
          <span class="product">Qualimetry</span>
        </div>
      </div>
      <nav>
        <a href="/index.html">Install</a>
        <a href="/scenarios.html" class="current">Scenarios</a>
      </nav>
    </header>

    <div class="app-shell">
      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="workspace-row">
              <select id="appSelect" class="workspace-select"></select>
              <button id="newAppBtn" class="ghost icon-btn" title="New workspace">+</button>
              <button id="deleteAppBtn" class="ghost icon-btn" title="Delete this workspace">&times;</button>
            </div>
            <input id="search" class="sidebar-search" type="text" placeholder="Search scenarios…" />
          </div>
          <div id="scenarioList" class="scenario-list"></div>
        </aside>

        <section id="detail" class="detail">
          <div class="detail-empty">Loading scenarios…</div>
        </section>
      </div>
    </div>

    <div id="deleteModal" class="modal-overlay" hidden>
      <div class="modal">
        <h3 id="deleteModalTitle">Delete?</h3>
        <p id="deleteModalText">This can't be undone.</p>
        <div class="modal-actions">
          <button id="deleteCancel" class="ghost">Cancel</button>
          <button id="deleteConfirm" class="danger">Delete</button>
        </div>
      </div>
    </div>

    <div id="newAppModal" class="modal-overlay" hidden>
      <div class="modal">
        <h3>New workspace</h3>
        <p>Group scenarios by the application they belong to (e.g. "Facebook", "Internal CRM").</p>
        <label class="field">
          <span>Application name</span>
          <input id="newAppName" type="text" placeholder="e.g. Facebook" />
        </label>
        <div class="modal-actions">
          <button id="newAppCancel" class="ghost">Cancel</button>
          <button id="newAppConfirm" class="primary">Create</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="brand.js"></script>
    <script src="app.js"></script>
  </body>
</html>
